name: Build Murafiq Pro (Windows EXE)
on:
  push:
    branches: [murafiq-pro]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: murafiq-pro-windows
          path: |
            dist/*.exe
      - name: Publish release (not marked latest, so maan.apk link stays)
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="murafiq-pro-v${VER}-${{ github.run_number }}"
          gh release create "$TAG" dist/MurafiqPro-Setup-*.exe dist/MurafiqPro-Portable-*.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "مرافق برو ${VER} (build ${{ github.run_number }})" \
            --notes "برنامج Windows لإدارة رحلات العمرة. Setup = نسخة تتثبّت. Portable = تخدم بلا تثبيت."
